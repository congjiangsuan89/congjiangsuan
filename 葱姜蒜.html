    gap: 6px;
    z-index: 10;
    overflow-y: auto;
    flex-shrink: 0;

  .sidebar-header {

    align-items: center;
    gap: 12px;
    padding: 0 8px 20px;

  .brand { color: white; }
  .brand-title { font-size: 22px; font-weight: 700; }
  .brand-subtitle { font-size: 12px; opacity: 0.85; margin-top: 4px; letter-spacing: 1px; }
  .brand-refresh { margin-left: auto; background: rgba(255,255,255,0.25); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 14px;
    cursor: pointer;
    color: white;
    font-size: 16px;
    transition: all 0.2s;
    user-select: none;
  }

  .nav-item:hover { background: rgba(255,255,255,0.15); }

  .nav-item.active {
    background: rgba(255,255,255,0.85);
    color: var(--text-dark);
    font-weight: 600;
  }

  .nav-icon { font-size: 20px; width: 26px; text-align: center; }

  /* ===== 主内容区 ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg-main);
  }

  .content-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
  }

  .page { display: none; }
  .page.active { display: block; }

  .page-title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .page-subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 24px;
  }

  /* 子项卡片 */
  .sub-col {
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 18px;
    padding: 14px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(124,92,191,0.06);
    min-width: 100px;
  }

  .sub-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(124,92,191,0.12);
  }

  .sub-card.active {
    border-color: var(--accent);
    background: #f3edf9;
  }

  .sub-card .card-icon { font-size: 32px; }
  .sub-card .card-label { font-size: 14px; font-weight: 500; text-align: center; }

  /* 内容展开区 */
  .detail-panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    overflow: hidden;
    display: none;
    flex: 1;

  .detail-header {

  .detail-panel iframe {

    height: 100%;
    min-height: 400px;
    border: none;
    display: block;
  }

  .detail-panel .local-wrap { padding: 20px; }

  /* 右侧两栏布局 */
  .page-layout {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .sub-col {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
  }

  .detail-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* 本地功能 */
  .input-row { display: flex; gap: 10px; margin-bottom: 16px; }

  .todo-input {

    background: var(--card-bg);

    color: var(--text-dark);

  .send-btn {

    border-radius: 20px;
    padding: 12px 24px;
    font-size: 14px;
    cursor: pointer;

  }

  .stats-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;

  .stat {

    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .stat strong { color: var(--text-dark); font-size: 18px; }

  .punch-btn {
    background: transparent;
    border: 1.5px solid var(--accent);

    border-radius: 16px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;

  .todo-list-card {

    padding: 16px 20px;

    padding: 12px 0;

  .todo-item:last-child { border-bottom: none; }

  .todo-check {

    border: 2px solid var(--accent);
    border-radius: 5px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: transparent;
    transition: all 0.2s;

  .todo-check.done { background: var(--accent); color: white; }

  .todo-text {
    flex: 1;
    font-size: 15px;
    word-break: break-all;

  .todo-text.done { text-decoration: line-through; color: var(--text-muted); }

  .todo-del {
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 4px;
    font-size: 15px;
  }

  .todo-del:hover { background: #fee2e2; color: #dc2626; }

  .todo-input-inline {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--text-dark);
    font-size: 15px;
    padding: 4px 0;
    outline: none;
    font-family: inherit;
  }
  .todo-input-inline:focus { border-bottom-color: var(--accent); }
  .todo-input-inline::placeholder { color: var(--text-muted); font-size: 13px; }

  .monthly-section { margin-top: 24px; }
  .monthly-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .monthly-title { font-size: 18px; font-weight: 700; }
  .monthly-nav { display: flex; gap: 6px; }

  .list-tip {

  .note-textarea {

function drawWeightChart() {
  const canvas = document.getElementById('weightChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const data = getWeightData();
  if (data.length < 2) { canvas.style.display = 'none'; return; }
  canvas.style.display = 'block';

  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth - 32;
  const h = 240;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  const vals = data.map(d => d.w);
  const min = Math.floor(Math.min(...vals) - 2);
  const max = Math.ceil(Math.max(...vals) + 2);
  const pad = { top: 20, right: 20, bottom: 40, left: 50 };
  const pw = w - pad.left - pad.right, ph = h - pad.top - pad.bottom;

  // 背景
  ctx.fillStyle = '#faf7fd'; ctx.fillRect(0, 0, w, h);

  // 网格线
  ctx.strokeStyle = '#efe5f8'; ctx.lineWidth = 1;
  const ySteps = 4;
  for (let i = 0; i <= ySteps; i++) {
    const y = pad.top + (ph / ySteps) * i;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#8a7aa0'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText((max - ((max - min) / ySteps) * i).toFixed(1), pad.left - 8, y + 4);
  }

  // X 轴标签（最多显示 8 个）
  const xLabels = data.map(d => d.date.slice(5));
  const step = Math.ceil(data.length / 7);
  xLabels.forEach((label, i) => {
    if (i % step !== 0 && i !== data.length - 1) return;
    const x = pad.left + (pw / (data.length - 1)) * i;
    ctx.fillStyle = '#8a7aa0'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, x, h - pad.bottom + 16);
  });

  // 折线
  ctx.beginPath();
  ctx.strokeStyle = '#7c5cbf'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  data.forEach((d, i) => {
    const x = pad.left + (data.length > 1 ? (pw / (data.length - 1)) * i : pw / 2);
    const y = pad.top + ph - ((d.w - min) / (max - min)) * ph;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // 数据点
  data.forEach((d, i) => {
    const x = pad.left + (data.length > 1 ? (pw / (data.length - 1)) * i : pw / 2);
    const y = pad.top + ph - ((d.w - min) / (max - min)) * ph;
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#7c5cbf'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  });
}

  var dates = Object.keys(allData).sort().reverse();
  var historyHtml = '';
  if (dates.length > 1) {
    historyHtml = '<details style="margin-top:20px;"><summary style="cursor:pointer;color:var(--text-muted);font-size:14px;font-weight:600;">📅 历史记录 ('+(dates.length-1)+'天)</summary><div style="margin-top:10px;">';
    dates.forEach(function(d){
      if (d === today) return;
      var dd = allData[d] || {};
      var dc = mealCal(dd.breakfast||[]) + mealCal(dd.lunch||[]) + mealCal(dd.dinner||[]);
      var detailHtml = '';
      ['breakfast','lunch','dinner'].forEach(function(m){
        var mLabel = {breakfast:'🌅早餐',lunch:'☀️午餐',dinner:'🌙晚餐'}[m];
        (dd[m]||[]).forEach(function(f){
          detailHtml += '<div style="font-size:12px;padding:2px 0;color:#666;">'+mLabel+' '+escapeHtml(f.name)+' '+f.gram+'g '+f.cal+'千卡</div>';
        });
      });
      historyHtml += '<details style="margin-bottom:4px;"><summary style="cursor:pointer;padding:6px 0;border-bottom:1px solid var(--card-border);font-size:13px;display:flex;justify-content:space-between;"><span>'+d+'</span><span style="color:var(--accent);">'+dc+'千卡</span></summary><div style="padding:4px 0 8px 12px;">'+detailHtml+'</div></details>';
    });
    historyHtml += '</div></details>';
  }

  body.innerHTML = '<div class="local-wrap">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">'+
      '<div style="font-size:16px;font-weight:700;">📅 '+today+'</div>'+
      '<div style="font-size:20px;font-weight:700;color:var(--accent);">总计 '+totalCal+' 千卡</div>'+
    '</div>'+
    mealSection('breakfast','早餐','🌅')+
    mealSection('lunch','午餐','☀️')+
    mealSection('dinner','晚餐','🌙')+
    historyHtml+
  '</div>';
}

function addDietFood(meal) {
  var nameEl = document.getElementById('food_'+meal);
  var gramEl = document.getElementById('gram_'+meal);
  if (!nameEl || !gramEl) return;
  var name = nameEl.value.trim();
  var gram = parseFloat(gramEl.value);
  if (!name || isNaN(gram) || gram <= 0) return;
  var calPer100 = findFoodCal(name);
  var cal = Math.round(calPer100 * gram / 100);
  var today = new Date().toISOString().split('T')[0];
  var allData = getDietData();
  if (!allData[today]) allData[today] = { breakfast: [], lunch: [], dinner: [] };
  allData[today][meal].push({ name: name, gram: gram, cal: cal });
  saveDietData(allData);
  nameEl.value = ''; gramEl.value = '';
  var body = document.querySelector('#detail-body');
  if (body) renderDietPanel(body);
  nameEl.focus();
}

function delDietFood(meal, idx) {
  var today = new Date().toISOString().split('T')[0];
  var allData = getDietData();
  if (allData[today] && allData[today][meal]) {
    allData[today][meal].splice(idx, 1);
    saveDietData(allData);
  }
  var body = document.querySelector('#detail-body');
  if (body) renderDietPanel(body);
}

// ===== 每日笔记（灵感/总结等按日期存储）=====
function getDailyData(key) { return JSON.parse(localStorage.getItem('cjs_daily_'+key) || '{}'); }
function saveDailyData(key, data) { localStorage.setItem('cjs_daily_'+key, JSON.stringify(data)); }

function renderDailyPanel(body, key) {
  var today = getToday();
  var data = getDailyData(key);
  var todayText = data[today] || '';

  var dates = Object.keys(data).sort().reverse();
  var historyHtml = '';
  dates.forEach(function(d){
    if (d === today || !data[d]) return;
    historyHtml += '<details style="margin-bottom:4px;"><summary style="cursor:pointer;padding:6px 0;border-bottom:1px solid var(--card-border);font-size:13px;">📅 '+d+'</summary><div style="padding:8px 12px;font-size:13px;color:#555;white-space:pre-wrap;line-height:1.6;">'+escapeHtml(data[d])+'</div></details>';
  });

  body.innerHTML = '<div class="local-wrap">'+
    '<div style="font-weight:700;margin-bottom:8px;">📅 '+today+'</div>'+
    '<div class="note-hint">💡 内容自动按日期保存，每日独立</div>'+
    '<textarea class="note-textarea" id="dailyArea_'+key+'" placeholder="记录今天的灵感…" style="min-height:200px;">'+escapeHtml(todayText)+'</textarea>'+
    '<button class="note-save-btn" onclick="saveDaily(\''+key+'\')">保存</button>'+
    (historyHtml ? '<div style="margin-top:20px;"><div style="font-weight:600;margin-bottom:10px;color:var(--text-muted);font-size:14px;">📋 历史记录</div>'+historyHtml+'</div>' : '')+
  '</div>';
}

function saveDaily(key) {
  var area = document.getElementById('dailyArea_'+key);
  if (!area) return;
  var data = getDailyData(key);
  data[getToday()] = area.value;
  saveDailyData(key, data);
  alert('已保存 ✓');
}

// ===== 月度总结 =====
function getSummaryData() { return JSON.parse(localStorage.getItem('cjs_summary') || '{}'); }
function saveSummaryData(d) { localStorage.setItem('cjs_summary', JSON.stringify(d)); }

function getMonthKey() {
  var now = new Date();
  return now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
}

function renderSummaryCalendar() {
  var container = document.getElementById('summaryCalendar');
  if (!container) return;
  var data = getMonthData();
  var today = new Date();
  var now = { y: today.getFullYear(), m: today.getMonth(), d: today.getDate() };
  var firstDay = new Date(summaryMonthView.year, summaryMonthView.month, 1).getDay();
  var daysInMonth = new Date(summaryMonthView.year, summaryMonthView.month + 1, 0).getDate();
  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var weekDays = ['日','一','二','三','四','五','六'];
  var keyPrefix = summaryMonthView.year + '-' + String(summaryMonthView.month+1).padStart(2,'0') + '-';

  var html = '<div class="monthly-header" style="margin-bottom:8px;">';
  html += '<div class="monthly-nav">';
  html += '<button onclick="changeSummaryMonth(-1)">◀</button>';
  html += '<span style="padding:6px 10px;font-weight:700;font-size:16px;">'+summaryMonthView.year+'年'+monthNames[summaryMonthView.month]+'</span>';
  html += '<button onclick="changeSummaryMonth(1)">▶</button>';
  html += '</div></div>';

  html += '<div class="month-grid">';
  weekDays.forEach(function(w){ html += '<div class="day-head">'+w+'</div>'; });

  var checkedDays = 0, totalDays = 0;
  for (var i = 0; i < firstDay; i++) { html += '<div class="day-cell empty"></div>'; }
  for (var d = 1; d <= daysInMonth; d++) {
    totalDays++;
    var key = keyPrefix + String(d).padStart(2,'0');
    var isChecked = data[key] === true;
    if (isChecked) checkedDays++;
    var cls = 'day-cell';
    if (now.y === summaryMonthView.year && now.m === summaryMonthView.month && now.d === d) cls += ' today';
    if (isChecked) cls += ' checked';
    html += '<div class="'+cls+'" onclick="toggleMonthDay(\''+key+'\')"><span class="day-num">'+d+'</span><span class="day-mark">'+(isChecked?'✓':'')+'</span></div>';
  }
  html += '</div>';

  var rate = totalDays > 0 ? Math.round(checkedDays / totalDays * 100) : 0;
  html += '<div class="month-stats"><span>✅ 已打卡 '+checkedDays+'/'+totalDays+' 天</span><span>完成率 '+rate+'%</span></div>';

  container.innerHTML = '<div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:16px;margin-bottom:20px;">'+html+'</div>';
}

function changeSummaryMonth(delta) {
  summaryMonthView.month += delta;
  if (summaryMonthView.month > 11) { summaryMonthView.month = 0; summaryMonthView.year++; }
  if (summaryMonthView.month < 0) { summaryMonthView.month = 11; summaryMonthView.year--; }
  renderSummaryCalendar();
}

function renderMonthlySummary() {
  var container = document.getElementById('summaryNote');
  if (!container) return;
  var data = getSummaryData();
  var thisMonth = getMonthKey();
  var thisText = data[thisMonth] || '';

  var months = Object.keys(data).sort().reverse();
  var historyHtml = '';
  months.forEach(function(m){
    if (m === thisMonth || !data[m]) return;
    historyHtml += '<details style="margin-bottom:4px;"><summary style="cursor:pointer;padding:6px 0;border-bottom:1px solid var(--card-border);font-size:13px;">📅 '+m+'</summary><div style="padding:8px 12px;font-size:13px;color:#555;white-space:pre-wrap;line-height:1.6;">'+escapeHtml(data[m])+'</div></details>';
  });

  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var m = new Date().getMonth();
  container.innerHTML = '<div class="note-card">'+
    '<div style="font-weight:700;margin-bottom:8px;">📅 '+monthNames[m]+' 月度总结</div>'+
    '<div class="note-hint">💡 每月独立保存，自动切换</div>'+
    '<textarea class="note-textarea" id="summaryArea" placeholder="写下本月总结…">'+escapeHtml(thisText)+'</textarea>'+
    '<button class="note-save-btn" onclick="saveMonthlySummary()">保存</button>'+
    (historyHtml ? '<div style="margin-top:20px;"><div style="font-weight:600;margin-bottom:10px;color:var(--text-muted);font-size:14px;">📋 历史总结</div>'+historyHtml+'</div>' : '')+
  '</div>';
}

function saveMonthlySummary() {
  var area = document.getElementById('summaryArea');
  if (!area) return;
  var data = getSummaryData();
  data[getMonthKey()] = area.value;
  saveSummaryData(data);
  alert('已保存 ✓');
}
