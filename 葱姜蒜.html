<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-main: #faf7fd;
    --sidebar-bg: linear-gradient(180deg, #d8c8f0 0%, #c4aee8 50%, #b095dc 100%);
    --text-dark: #4a3570;
    --text-light: #ffffff;
    --text-muted: #8a7aa0;
    --accent: #7c5cbf;
    --card-bg: #ffffff;
    --card-border: #efe5f8;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-main);
    color: var(--text-dark);
    height: 100vh;
    overflow: hidden;
    padding-top: 0;
    -webkit-text-size-adjust: 100%;
  }

  /* iOS 状态栏安全区 - 处理灵动岛和刘海 */
  @supports (padding-top: env(safe-area-inset-top)) {
    body { padding-top: env(safe-area-inset-top); }
  }

  .app { display: flex; height: 100vh; width: 100%; min-width: 320px; }

  /* ===== 左侧菜单 ===== */
  .sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--sidebar-bg);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 10;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0 8px 20px;
  }

  .brand { color: white; text-align: center; }
  .brand-title { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .brand-subtitle { font-size: 12px; opacity: 0.85; margin-top: 4px; letter-spacing: 1px; }
  .brand-refresh { margin-left: auto; background: rgba(255,255,255,0.25); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 14px;
    cursor: pointer;
    color: white;
    font-size: 16px;
    transition: all 0.2s;
    user-select: none;
  }

  .nav-item:hover { background: rgba(255,255,255,0.15); }

  .nav-item.active {
    background: rgba(255,255,255,0.85);
    color: var(--text-dark);
    font-weight: 600;
  }

  .nav-icon { font-size: 20px; width: 26px; text-align: center; }

  /* ===== 主内容区 ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg-main);
  }

  .content-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
  }

  .page { display: none; }
  .page.active { display: block; }

  .page-title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .page-subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 24px;
  }

  /* 子项卡片 */
  .sub-col {
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 18px;
    padding: 14px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(124,92,191,0.06);
    min-width: 100px;
  }

  .sub-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(124,92,191,0.12);
  }

  .sub-card.active {
    border-color: var(--accent);
    background: #f3edf9;
  }

  .sub-card .card-icon { font-size: 32px; }
  .sub-card .card-label { font-size: 14px; font-weight: 500; text-align: center; }

  /* 内容展开区 */
  .detail-panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    overflow: hidden;
    display: none;
    flex: 1;
    min-height: 300px;
  }

  .detail-panel.open { display: flex; flex-direction: column; }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--card-border);
    font-size: 15px;
    color: var(--text-muted);
    font-weight: 600;
    flex-shrink: 0;
    position: relative;
  }

  .detail-close {
    margin-left: auto;
    background: rgba(124,92,191,0.1);
    border: none;
    color: var(--accent);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .detail-close:active { background: rgba(124,92,191,0.2); }

  .detail-body {
    flex: 1;
    overflow: auto;
  }

  .detail-panel iframe {
    width: 100%;
    height: 100%;
    min-height: 400px;
    border: none;
    display: block;
  }

  .detail-panel .local-wrap { padding: 20px; }

  /* 右侧两栏布局 */
  .page-layout {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .sub-col {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
  }

  .detail-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* 本地功能 */
  .input-row { display: flex; gap: 10px; margin-bottom: 16px; }

  .todo-input {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 12px 18px;
    color: var(--text-dark);
    font-size: 14px;
    outline: none;
  }

  .todo-input:focus { border-color: var(--accent); }

  .send-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 12px 24px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  .send-btn:hover { opacity: 0.9; }

  .stats-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .stat strong { color: var(--text-dark); font-size: 18px; }

  .punch-btn {
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    border-radius: 16px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
  }

  .punch-btn:hover { background: var(--accent); color: white; }

  .todo-list-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px 20px;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--card-border);
  }

  .todo-item:last-child { border-bottom: none; }

  .todo-check {
    width: 20px;
    height: 20px;
    border: 2px solid var(--accent);
    border-radius: 5px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: transparent;
    transition: all 0.2s;
  }

  .todo-check.done { background: var(--accent); color: white; }

  .todo-text {
    flex: 1;
    font-size: 15px;
    word-break: break-all;
  }

  .todo-text.done { text-decoration: line-through; color: var(--text-muted); }

  .todo-del {
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 4px;
    font-size: 15px;
  }

  .todo-del:hover { background: #fee2e2; color: #dc2626; }

  .todo-input-inline {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--text-dark);
    font-size: 15px;
    padding: 4px 0;
    outline: none;
    font-family: inherit;
  }
  .todo-input-inline:focus { border-bottom-color: var(--accent); }
  .todo-input-inline::placeholder { color: var(--text-muted); font-size: 13px; }

  .monthly-section { margin-top: 24px; }
  .monthly-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .monthly-title { font-size: 18px; font-weight: 700; }
  .monthly-nav { display: flex; gap: 6px; }
  .monthly-nav button { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--text-dark); }
  .monthly-nav button:hover { border-color: var(--accent); }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .month-grid .day-head { font-size: 12px; color: var(--text-muted); padding: 6px 0; font-weight: 600; }
  .month-grid .day-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.15s; user-select: none; background: var(--card-bg); border: 1px solid var(--card-border); }
  .month-grid .day-cell:hover { border-color: var(--accent); }
  .month-grid .day-cell.empty { background: transparent; border: none; cursor: default; }
  .month-grid .day-cell.today { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,92,191,0.15); }
  .month-grid .day-cell.checked { background: var(--accent); color: white; border-color: var(--accent); }
  .month-grid .day-cell .day-num { line-height: 1; }
  .month-grid .day-cell .day-mark { font-size: 10px; margin-top: 2px; }
  .month-stats { margin-top: 12px; display: flex; gap: 16px; font-size: 13px; color: var(--text-muted); }

  .list-tip {
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
    padding: 20px 0;
  }

  .note-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
  }

  .note-hint {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 12px;
  }

  .note-textarea {
    width: 100%;
    min-height: 320px;
    background: #faf7fd;
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    color: var(--text-dark);
    font-size: 15px;
    line-height: 1.8;
    outline: none;
    resize: vertical;
    font-family: inherit;
  }

  .note-textarea:focus { border-color: var(--accent); }

  .note-save-btn {
    margin-top: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 16px;
    padding: 10px 24px;
    font-size: 14px;
    cursor: pointer;
  }

  .note-save-btn:hover { opacity: 0.9; }

  .weight-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .weight-row input { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 10px 14px; color: var(--text-dark); font-size: 14px; outline: none; }
  .weight-row input:focus { border-color: var(--accent); }
  .weight-row input[type="date"] { width: 150px; }
  .weight-row input[type="number"] { width: 100px; }
  .weight-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
  .weight-table th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--card-border); color: var(--text-muted); font-weight: 600; }
  .weight-table td { padding: 10px 12px; border-bottom: 1px solid var(--card-border); }
  .weight-table .del-col { width: 40px; text-align: center; }
  .weight-table .del-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; }
  .weight-table .del-btn:hover { color: #dc2626; }
  .weight-chart-wrap { margin-top: 16px; background: var(--card-bg); border-radius: 14px; padding: 16px; border: 1px solid var(--card-border); }
  .weight-chart-wrap canvas { width: 100% !important; max-height: 260px; }
  .weight-empty { color: var(--text-muted); text-align: center; padding: 30px 0; font-size: 14px; }

  @media (max-width: 768px) {
    body { touch-action: manipulation; }
    .app { flex-direction: row; min-width: 100%; }
    .sidebar { width: 110px; min-width: 110px; padding: 12px 8px; gap: 4px; }
    .sidebar-header { padding: 0 4px 12px; }
    .brand-title { font-size: 22px; }
    .brand-subtitle { display: none; }
    .nav-item { flex-direction: column; padding: 8px 4px; font-size: 10px; gap: 4px; text-align: center; }
    .nav-icon { font-size: 18px; width: auto; }
    .main { height: 100vh; }
    .content-scroll { padding: 12px; }
    .page-title { font-size: 18px; margin-bottom: 4px; }
    .page-subtitle { font-size: 12px; margin-bottom: 12px; }
    .page-layout { gap: 10px; }
    .sub-col { width: 90px; gap: 8px; max-height: calc(100vh - 100px); }
    .sub-card { min-width: 80px; padding: 10px 6px; gap: 5px; }
    .sub-card .card-icon { font-size: 20px; }
    .sub-card .card-label { font-size: 10px; }
    .detail-panel iframe { min-height: 300px; }
    .detail-header { font-size: 13px; padding: 10px 12px; }
    .detail-close { width: 24px; height: 24px; font-size: 16px; }
    .detail-panel .local-wrap { padding: 12px; }
    .note-textarea { min-height: 200px; padding: 12px; font-size: 13px; }
    .note-save-btn { padding: 8px 16px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- ===== 左侧菜单 ===== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-title">葱姜蒜</div>

      <button class="brand-refresh" onclick="location.reload(true)" title="刷新" style="width:100%;border-radius:12px;padding:10px 0;">🔄</button>

  </aside>

  <!-- ===== 主内容区 ===== -->
  <main class="main">
    <div class="content-scroll" id="contentScroll">

      <!-- 今日计划 -->
      <div class="page active" id="page-todo">

        <div class="page-subtitle">完成一项，打勾一项</div>

function closeDetail(key) {
  const panel = document.getElementById('detail-' + key);
  if (!panel) return;
  const header = panel.querySelector('.detail-header');
  const body = panel.querySelector('.detail-body');
  panel.classList.remove('open');

  if (header) header.innerHTML = '<span>👆 点击左侧子项</span><button class="detail-close" onclick="closeDetail(\''+key+'\')" aria-label="关闭">×</button>';

  const pageEl = document.getElementById('page-' + key);
  if (pageEl) pageEl.querySelectorAll('.sub-card').forEach(c => c.classList.remove('active'));
}

function recordLinkProgress(progressKey, label) {
  if (!progressKey) return;
  var now = new Date();
  var ts = now.getTime();
  var dateStr = now.toISOString().split('T')[0];
  var timeStr = now.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  localStorage.setItem('cjs_' + progressKey, JSON.stringify({time:ts, date:dateStr, timeStr:timeStr, label:label}));
}

function getToday() { return new Date().toISOString().split('T')[0]; }
function getTodoData() { return JSON.parse(localStorage.getItem('cjs_todos_v2') || '{}'); }
function saveTodoData(d) { localStorage.setItem('cjs_todos_v2', JSON.stringify(d)); }
function getTodayTodos() {
  var today = getToday();
  var all = getTodoData();
  if (!all[today]) all[today] = [
    { text: '', done: false }, { text: '', done: false }, { text: '', done: false },
    { text: '', done: false }, { text: '', done: false }, { text: '', done: false }
  ];
  return all[today];
}
function saveTodayTodos(todos) {
  var all = getTodoData();
  all[getToday()] = todos;
  saveTodoData(all);
}

function renderTodoList() {
  var list = document.getElementById('todoList'), totalEl = document.getElementById('totalCount'), doneEl = document.getElementById('doneCount');
  if (!list) return;
  var todos = getTodayTodos();
  list.querySelectorAll('.todo-item').forEach(function(el){ el.remove(); });
  todos.forEach(function(t, i){
    var div = document.createElement('div'); div.className = 'todo-item';
    div.innerHTML = '<div class="todo-check '+(t.done?'done':'')+'" onclick="toggleTodo('+i+')">✓</div><input class="todo-input-inline" id="todoText'+i+'" value="'+escapeHtml(t.text)+'" placeholder="输入计划…" onchange="updateTodoText('+i+')" onblur="updateTodoText('+i+')"><button class="todo-del" onclick="delTodo('+i+')">×</button>';
    list.appendChild(div);
  });
  var hasText = todos.filter(function(t){ return t.text.trim(); }).length;
  var doneCount = todos.filter(function(t){ return t.done; }).length;
  totalEl.textContent = hasText; doneEl.textContent = doneCount;
  renderTodoSummary();
  renderTodoHistory();
}

function addTodo() {
  var input = document.getElementById('todoInput'); if (!input) return;
  var text = input.value.trim(); if (!text) return;
  var todos = getTodayTodos(); todos.unshift({ text: text, done: false });
  saveTodayTodos(todos); renderTodoList(); input.value = ''; input.focus();
}
function toggleTodo(i) { var todos = getTodayTodos(); todos[i].done = !todos[i].done; saveTodayTodos(todos); renderTodoList(); }
function updateTodoText(i) { var el = document.getElementById('todoText'+i); if (!el) return; var todos = getTodayTodos(); todos[i].text = el.value; saveTodayTodos(todos); }
function delTodo(i) { var todos = getTodayTodos(); todos.splice(i, 1); saveTodayTodos(todos); renderTodoList(); }
function clearDone() { var todos = getTodayTodos().filter(function(t){ return !t.done; }); saveTodayTodos(todos); renderTodoList(); }

// 今日总结
function renderTodoSummary() {
  var container = document.getElementById('todoSummary');
  if (!container) return;
  var today = getToday();
  var data = getTodoData();
  var summaryKey = 'summary_' + today;
  var allSummaries = JSON.parse(localStorage.getItem('cjs_todo_summary') || '{}');
  var todaySummary = allSummaries[summaryKey] || '';

  var todos = getTodayTodos();
  var done = todos.filter(function(t){ return t.done && t.text.trim(); });
  var undone = todos.filter(function(t){ return !t.done && t.text.trim(); });

  var autoSummary = '';
  if (done.length > 0) autoSummary += '✅ 已完成：' + done.map(function(t){ return t.text; }).join('、');
  if (undone.length > 0) {
    if (autoSummary) autoSummary += '\n';
    autoSummary += '⬜ 未完成：' + undone.map(function(t){ return t.text; }).join('、');
  }

  container.innerHTML = '<div class="note-card" style="margin-top:12px;">'+
    '<div style="font-weight:700;margin-bottom:4px;">📝 今日总结</div>'+
    '<div class="note-hint">可手动编辑，自动汇总今日计划状态</div>'+
    '<textarea class="note-textarea" id="todoSummaryArea" placeholder="今日总结…" style="min-height:100px;">'+(todaySummary || autoSummary)+'</textarea>'+
    '<button class="note-save-btn" onclick="saveTodoSummary()">保存</button>'+
  '</div>';
}

function saveTodoSummary() {
  var area = document.getElementById('todoSummaryArea');
  if (!area) return;
  var all = JSON.parse(localStorage.getItem('cjs_todo_summary') || '{}');
  all['summary_' + getToday()] = area.value;
  localStorage.setItem('cjs_todo_summary', JSON.stringify(all));
  alert('已保存 ✓');
}

// 历史回顾
function renderTodoHistory() {
  var container = document.getElementById('todoHistory');
  if (!container) return;
  var all = getTodoData();
  var dates = Object.keys(all).sort().reverse();
  var today = getToday();
  var html = '';
  dates.forEach(function(d){
    if (d === today) return;
    var items = all[d] || [];
    var done = items.filter(function(t){ return t.done; }).length;
    var total = items.filter(function(t){ return t.text.trim(); }).length;
    var rowHtml = items.filter(function(t){ return t.text.trim(); }).map(function(t){
      return '<div style="font-size:12px;padding:2px 0;color:#666;">'+(t.done?'✅':'⬜')+' '+escapeHtml(t.text)+'</div>';
    }).join('');
    html += '<details style="margin-bottom:4px;"><summary style="cursor:pointer;padding:6px 0;border-bottom:1px solid var(--card-border);font-size:13px;display:flex;justify-content:space-between;"><span>'+d+'</span><span style="color:var(--accent);">'+done+'/'+total+' 完成</span></summary><div style="padding:4px 0 8px 12px;">'+(rowHtml||'<div style="color:var(--text-muted);font-size:12px;">无记录</div>')+'</div></details>';
  });
  if (html) {
    container.innerHTML = '<div style="margin-top:20px;"><div style="font-weight:600;margin-bottom:10px;color:var(--text-muted);font-size:14px;">📋 历史计划</div>'+html+'</div>';
  } else {
    container.innerHTML = '';
  }
}

function saveNote(key) { const area = document.getElementById('noteArea_' + key); if (area) localStorage.setItem('cjs_note_' + key, area.value); alert('已保存 ✓'); }
function escapeHtml(s) { const div = document.createElement('div'); div.textContent = s; return div.innerHTML; }

// ===== 体重记录 =====
function getWeightData() { return JSON.parse(localStorage.getItem('cjs_weight') || '[]'); }
function saveWeightData(data) { localStorage.setItem('cjs_weight', JSON.stringify(data)); }

function renderWeightPanel(body) {
  const data = getWeightData();
  const today = new Date().toISOString().split('T')[0];
  body.innerHTML = `
    <div class="local-wrap">
      <div class="weight-row">
        <input type="date" id="weightDate" value="${today}" max="${today}">
        <input type="number" id="weightVal" placeholder="体重(斤)" step="0.1" min="30" max="600">
        <button class="send-btn" onclick="addWeight()">记录</button>
      </div>
      ${data.length === 0 ? '<div class="weight-empty">还没有体重记录，开始记录吧 ⚡</div>' : `
        <div class="weight-chart-wrap">
          <canvas id="weightChart"></canvas>
        </div>
        <table class="weight-table">
          <thead><tr><th>日期</th><th>体重(斤)</th><th class="del-col"></th></tr></thead>
          <tbody>
            ${data.map((d,i) => `<tr><td>${d.date}</td><td>${d.w}</td><td class="del-col"><button class="del-btn" onclick="delWeight(${i})">×</button></td></tr>`).join('')}
          </tbody>
        </table>
      `}
    </div>`;
  if (data.length > 0) setTimeout(drawWeightChart, 100);
}

function addWeight() {
  const dateEl = document.getElementById('weightDate');
  const valEl = document.getElementById('weightVal');
  if (!dateEl || !valEl) return;
  const date = dateEl.value, w = parseFloat(valEl.value);
  if (!date || isNaN(w)) return;
  let data = getWeightData();
  data.push({ date, w });
  data.sort((a,b) => a.date.localeCompare(b.date));
  saveWeightData(data);
  const body = document.querySelector('#detail-body .local-wrap') ? document.querySelector('#detail-body') : null;
  if (body) renderWeightPanel(body);
}

function delWeight(i) {
  let data = getWeightData();
  data.splice(i, 1);
  saveWeightData(data);
  const body = document.querySelector('#detail-body');
  if (body) renderWeightPanel(body);
}

function drawWeightChart() {
  const canvas = document.getElementById('weightChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const data = getWeightData();
  if (data.length < 2) { canvas.style.display = 'none'; return; }
  canvas.style.display = 'block';

  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth - 32;
  const h = 240;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  const vals = data.map(d => d.w);
  const min = Math.floor(Math.min(...vals) - 5);
  const max = Math.ceil(Math.max(...vals) + 5);
  const pad = { top: 20, right: 20, bottom: 40, left: 50 };
  const pw = w - pad.left - pad.right, ph = h - pad.top - pad.bottom;

  // 背景
  ctx.fillStyle = '#faf7fd'; ctx.fillRect(0, 0, w, h);

  // 网格线
  ctx.strokeStyle = '#efe5f8'; ctx.lineWidth = 1;
  const ySteps = 4;
  for (let i = 0; i <= ySteps; i++) {
    const y = pad.top + (ph / ySteps) * i;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#8a7aa0'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText((max - ((max - min) / ySteps) * i).toFixed(1), pad.left - 8, y + 4);
  }

  // X 轴标签（最多显示 8 个）
  const xLabels = data.map(d => d.date.slice(5));
  const step = Math.ceil(data.length / 7);
  xLabels.forEach((label, i) => {
    if (i % step !== 0 && i !== data.length - 1) return;
    const x = pad.left + (pw / (data.length - 1)) * i;
    ctx.fillStyle = '#8a7aa0'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, x, h - pad.bottom + 16);
  });

  // 折线
  ctx.beginPath();
  ctx.strokeStyle = '#7c5cbf'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  data.forEach((d, i) => {
    const x = pad.left + (data.length > 1 ? (pw / (data.length - 1)) * i : pw / 2);
    const y = pad.top + ph - ((d.w - min) / (max - min)) * ph;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // 数据点
  data.forEach((d, i) => {
    const x = pad.left + (data.length > 1 ? (pw / (data.length - 1)) * i : pw / 2);
    const y = pad.top + ph - ((d.w - min) / (max - min)) * ph;
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#7c5cbf'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  });
}

function normalizeFoodName(name) {
  return name.replace(/[烤煎炒炸蒸煮炖卤拌焖焗红烧清炖干锅蒜蓉蚝油]/g, '').replace(/^(一份|一个|一碗|一杯|盘|碗|片|块|根|只)\s*/, '').trim();
}

function findFoodCal(name) {
  name = name.trim();
  if (!name) return {cal:0, matched:''};
  // 1. 精确匹配内置数据库
  if (FOOD_DB[name]) return {cal:FOOD_DB[name], matched:name};
  // 2. 模糊匹配内置数据库
  for (var k in FOOD_DB) {
    if (k.indexOf(name) !== -1 || name.indexOf(k) !== -1) return {cal:FOOD_DB[k], matched:k};
  }
  // 3. 去烹饪词再试内置数据库
  var simple = normalizeFoodName(name);
  if (simple && simple !== name) {
    if (FOOD_DB[simple]) return {cal:FOOD_DB[simple], matched:simple};
    for (var k2 in FOOD_DB) {
      if (k2.indexOf(simple) !== -1 || simple.indexOf(k2) !== -1) return {cal:FOOD_DB[k2], matched:k2};
    }
  }
  // 4. 查薄荷大数据库 (8,000+ 条)
  if (typeof BOOHEE_FOOD_DB !== 'undefined') {
    if (BOOHEE_FOOD_DB[name]) return {cal:BOOHEE_FOOD_DB[name], matched:name};
    for (var bk in BOOHEE_FOOD_DB) {
      if (bk.indexOf(name) !== -1 || name.indexOf(bk) !== -1) return {cal:BOOHEE_FOOD_DB[bk], matched:bk};
    }
    if (simple && simple !== name) {
      if (BOOHEE_FOOD_DB[simple]) return {cal:BOOHEE_FOOD_DB[simple], matched:simple};
      for (var bk2 in BOOHEE_FOOD_DB) {
        if (bk2.indexOf(simple) !== -1 || simple.indexOf(bk2) !== -1) return {cal:BOOHEE_FOOD_DB[bk2], matched:bk2};
      }
    }
  }
  return {cal:0, matched:''};
}

function mealCal(items) { return (items||[]).reduce(function(s,f){ return s + (f.cal||0); }, 0); }

      (rows || '<div style="color:var(--text-muted);font-size:13px;padding:6px 10px;">暂无记录</div>')+
      '<div style="display:flex;gap:6px;margin-top:8px;">'+
        '<input type="text" id="food_'+meal+'" placeholder="食物名" style="flex:1;background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:8px 12px;font-size:13px;outline:none;" onkeydown="if(event.key===\'Enter\')addDietFood(\''+meal+'\')">'+
        '<input type="number" id="gram_'+meal+'" placeholder="克" style="width:60px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:8px 12px;font-size:13px;outline:none;" min="1" onkeydown="if(event.key===\'Enter\')addDietFood(\''+meal+'\')">'+
        '<button class="send-btn" style="padding:8px 16px;font-size:13px;border-radius:12px;" onclick="addDietFood(\''+meal+'\')">+</button>'+
      '</div></div>';
  }

  var dates = Object.keys(allData).sort().reverse();
  var historyHtml = '';
  if (dates.length > 1) {
    historyHtml = '<details style="margin-top:20px;"><summary style="cursor:pointer;color:var(--text-muted);font-size:14px;font-weight:600;">📅 历史记录 ('+(dates.length-1)+'天)</summary><div style="margin-top:10px;">';
    dates.forEach(function(d){
      if (d === today) return;
      var dd = allData[d] || {};
      var dc = mealCal(dd.breakfast||[]) + mealCal(dd.lunch||[]) + mealCal(dd.dinner||[]);
      var detailHtml = '';
      ['breakfast','lunch','dinner'].forEach(function(m){
        var mLabel = {breakfast:'🌅早餐',lunch:'☀️午餐',dinner:'🌙晚餐'}[m];
        (dd[m]||[]).forEach(function(f){
          detailHtml += '<div style="font-size:12px;padding:2px 0;color:#666;">'+mLabel+' '+escapeHtml(f.name)+' '+f.gram+'g '+f.cal+'千卡</div>';
        });
      });
      historyHtml += '<details style="margin-bottom:4px;"><summary style="cursor:pointer;padding:6px 0;border-bottom:1px solid var(--card-border);font-size:13px;display:flex;justify-content:space-between;"><span>'+d+'</span><span style="color:var(--accent);">'+dc+'千卡</span></summary><div style="padding:4px 0 8px 12px;">'+detailHtml+'</div></details>';

      '<div style="font-size:16px;font-weight:700;">📅 '+today+'</div>'+
      '<div style="font-size:20px;font-weight:700;color:var(--accent);">总计 '+totalCal+' 千卡</div>'+
    '</div>'+

    mealSection('dinner','晚餐','🌙')+
    historyHtml+
  '</div>';
}

function searchBooheeFood() {
  var q = (document.getElementById('boohee_search')||{}).value || '';
  var resDiv = document.getElementById('boohee_results');
  if (!resDiv) return;
  if (!q || q.length < 1) { resDiv.innerHTML = ''; return; }
  if (typeof BOOHEE_FOOD_DB === 'undefined') { resDiv.innerHTML = '<div style="color:#999;padding:8px;">薄荷食物库加载中...</div>'; return; }
  var results = [];
  for (var k in BOOHEE_FOOD_DB) {
    if (k.indexOf(q) !== -1) results.push({name:k, cal:BOOHEE_FOOD_DB[k]});
    if (results.length >= 30) break;
  }
  if (!results.length) {
    resDiv.innerHTML = '<div style="color:#999;padding:8px;">未找到包含"'+escapeHtml(q)+'"的食物，试试其他关键词</div>';
    return;
  }
  resDiv.innerHTML = results.map(function(r){
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid #f0e8f5;cursor:pointer;border-radius:6px;" onclick="fillFoodName(\''+escapeHtml(r.name).replace(/'/g,"\\'")+'\')" onmouseover="this.style.background=\'#f5effb\'" onmouseout="this.style.background=\'\'">'+
      '<span>'+escapeHtml(r.name)+'</span>'+
      '<span style="color:var(--accent);font-weight:600;">'+r.cal+'千卡/100g</span>'+
    '</div>';
  }).join('');
}

function fillFoodName(name) {
  // 找到当前聚焦的输入框，或者第一个空的
  var inputs = document.querySelectorAll('input[id^="food_"]');
  for (var i=0; i<inputs.length; i++) {
    if (document.activeElement === inputs[i] || !inputs[i].value) {
      inputs[i].value = name;
      inputs[i].focus();
      break;
    }
  }
  document.getElementById('boohee_results').innerHTML = '';
  document.getElementById('boohee_search').value = '';
}

function addDietFood(meal) {
  var nameEl = document.getElementById('food_'+meal);
  var gramEl = document.getElementById('gram_'+meal);
  if (!nameEl || !gramEl) return;
  var name = nameEl.value.trim();
  var gram = parseFloat(gramEl.value);
  if (!name || isNaN(gram) || gram <= 0) return;
  var found = findFoodCal(name);
  var calPer100 = found.cal;
  var matchedName = found.matched;
  if (calPer100 <= 0) {
    var manual = prompt('未找到 "'+name+'" 的热量数据，请手动输入每100克多少千卡（例如：猪肉约395）：');
    if (!manual) return;
    calPer100 = parseFloat(manual);
    if (isNaN(calPer100) || calPer100 <= 0) return;
    matchedName = name;
  }
  var cal = Math.round(calPer100 * gram / 100);
  var today = new Date().toISOString().split('T')[0];
  var allData = getDietData();
  if (!allData[today]) allData[today] = { breakfast: [], lunch: [], dinner: [] };
  allData[today][meal].push({ name: name, gram: gram, cal: cal, matched: matchedName });
  saveDietData(allData);
  nameEl.value = ''; gramEl.value = '';
  var body = document.querySelector('#detail-body');
  if (body) renderDietPanel(body);
  nameEl.focus();
}

function delDietFood(meal, idx) {
  var today = new Date().toISOString().split('T')[0];
  var allData = getDietData();
  if (allData[today] && allData[today][meal]) {
    allData[today][meal].splice(idx, 1);
    saveDietData(allData);
  }
  var body = document.querySelector('#detail-body');
  if (body) renderDietPanel(body);
}

function getSummaryData() { return JSON.parse(localStorage.getItem('cjs_summary') || '{}'); }
function saveSummaryData(d) { localStorage.setItem('cjs_summary', JSON.stringify(d)); }

function getMonthKey() {
  var now = new Date();
  return now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
}

function renderSummaryCalendar() {
  var container = document.getElementById('summaryCalendar');
  if (!container) return;
  var data = getMonthData();
  var today = new Date();
  var now = { y: today.getFullYear(), m: today.getMonth(), d: today.getDate() };
  var firstDay = new Date(summaryMonthView.year, summaryMonthView.month, 1).getDay();
  var daysInMonth = new Date(summaryMonthView.year, summaryMonthView.month + 1, 0).getDate();
  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var weekDays = ['日','一','二','三','四','五','六'];
  var keyPrefix = summaryMonthView.year + '-' + String(summaryMonthView.month+1).padStart(2,'0') + '-';

  var html = '<div class="monthly-header" style="margin-bottom:8px;">';
  html += '<div class="monthly-nav">';
  html += '<button onclick="changeSummaryMonth(-1)">◀</button>';
  html += '<span style="padding:6px 10px;font-weight:700;font-size:16px;">'+summaryMonthView.year+'年'+monthNames[summaryMonthView.month]+'</span>';
  html += '<button onclick="changeSummaryMonth(1)">▶</button>';
  html += '</div></div>';

  html += '<div class="month-grid">';
  weekDays.forEach(function(w){ html += '<div class="day-head">'+w+'</div>'; });

  var checkedDays = 0, totalDays = 0;
  for (var i = 0; i < firstDay; i++) { html += '<div class="day-cell empty"></div>'; }
  for (var d = 1; d <= daysInMonth; d++) {
    totalDays++;
    var key = keyPrefix + String(d).padStart(2,'0');
    var isChecked = data[key] === true;
    if (isChecked) checkedDays++;
    var cls = 'day-cell';
    if (now.y === summaryMonthView.year && now.m === summaryMonthView.month && now.d === d) cls += ' today';
    if (isChecked) cls += ' checked';
    html += '<div class="'+cls+'" onclick="toggleMonthDay(\''+key+'\')"><span class="day-num">'+d+'</span><span class="day-mark">'+(isChecked?'✓':'')+'</span></div>';
  }
  html += '</div>';

  var rate = totalDays > 0 ? Math.round(checkedDays / totalDays * 100) : 0;
  html += '<div class="month-stats"><span>✅ 已打卡 '+checkedDays+'/'+totalDays+' 天</span><span>完成率 '+rate+'%</span></div>';

  container.innerHTML = '<div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:16px;margin-bottom:20px;">'+html+'</div>';
}

function changeSummaryMonth(delta) {
  summaryMonthView.month += delta;
  if (summaryMonthView.month > 11) { summaryMonthView.month = 0; summaryMonthView.year++; }
  if (summaryMonthView.month < 0) { summaryMonthView.month = 11; summaryMonthView.year--; }
  renderSummaryCalendar();
}

function getCheckinTasks() { return JSON.parse(localStorage.getItem('cjs_checkin_tasks') || '[]'); }
function saveCheckinTasks(d) { localStorage.setItem('cjs_checkin_tasks', JSON.stringify(d)); }
function getCheckinRecords() { return JSON.parse(localStorage.getItem('cjs_checkin_records') || '{}'); }
function saveCheckinRecords(d) { localStorage.setItem('cjs_checkin_records', JSON.stringify(d)); }

function renderCheckinPanel() {
  const panel = document.getElementById('checkinPanel');
  if (!panel) return;
  var tasks = getCheckinTasks();
  var records = getCheckinRecords();
  var today = getToday();
  var todayRecords = records[today] || {};

  var html = '<div class="local-wrap">';

  // 今日打卡概览
  var doneCount = 0;
  tasks.forEach(function(t){ if (todayRecords[t.id]) doneCount++; });
  var totalCount = tasks.length;
  var pct = totalCount > 0 ? Math.round(doneCount/totalCount*100) : 0;

  html += '<div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:16px;margin-bottom:16px;">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="font-size:16px;font-weight:700;">📅 '+today+'</span><span style="font-size:14px;color:var(--accent);font-weight:600;">'+doneCount+'/'+totalCount+' 已完成</span></div>';
  if (totalCount > 0) {
    html += '<div style="background:#f0e8f5;border-radius:10px;height:8px;overflow:hidden;"><div style="background:var(--accent);height:100%;width:'+pct+'%;transition:width 0.3s;"></div></div>';
  }
  html += '</div>';

  // 任务列表
  if (tasks.length === 0) {
    html += '<div class="weight-empty">还没有打卡任务，在下方添加吧 ✨</div>';
  } else {
    html += '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">';
    tasks.forEach(function(t) {
      var isChecked = todayRecords[t.id];
      var streak = getCheckinStreak(t.id, records);
      html += '<div style="display:flex;align-items:center;gap:12px;background:var(--card-bg);border:1px solid '+(isChecked?'var(--accent)':'var(--card-border)')+';border-radius:14px;padding:12px 14px;'+(isChecked?'opacity:0.7;':'')+'">';
      html += '<button onclick="toggleCheckin(\''+t.id+'\')" style="width:28px;height:28px;border-radius:50%;border:2px solid '+(isChecked?'var(--accent)':'#ddd')+';background:'+(isChecked?'var(--accent)':'transparent')+';color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;">'+(isChecked?'✓':'')+'</button>';
      html += '<div style="flex:1;min-width:0;">';
      html += '<div style="font-size:15px;font-weight:600;color:var(--text-dark);'+(isChecked?'text-decoration:line-through;':'')+'">'+escapeHtml(t.name)+'</div>';
      if (t.url) {
        html += '<a href="'+t.url+'" target="_blank" style="font-size:12px;color:var(--accent);text-decoration:none;" onclick="event.stopPropagation();">🔗 去完成</a>';
      }
      html += '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">🔥 连续 '+streak+' 天</div>';
      html += '</div>';
      html += '<button onclick="deleteCheckinTask(\''+t.id+'\')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:4px;" title="删除">⋯</button>';
      html += '</div>';
    });
    html += '</div>';
  }

  // 添加新任务
  html += '<div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:16px;margin-bottom:16px;">';
  html += '<div style="font-weight:600;margin-bottom:12px;font-size:14px;">➕ 添加打卡任务</div>';
  html += '<div style="display:flex;flex-direction:column;gap:10px;">';
  html += '<input type="text" id="checkinName" placeholder="任务名称（如：蚂蚁森林收能量）" style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;">';
  html += '<input type="text" id="checkinUrl" placeholder="链接（可选，如支付宝口令）" style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;">';
  html += '<button onclick="addCheckinTask()" class="note-save-btn" style="align-self:flex-start;">添加任务</button>';
  html += '</div>';
  html += '</div>';

  // 历史记录
  var dates = Object.keys(records).sort().reverse().slice(0, 7);
  if (dates.length > 0) {
    html += '<details style="margin-top:8px;"><summary style="cursor:pointer;color:var(--text-muted);font-size:14px;font-weight:600;">📋 最近7天记录</summary><div style="margin-top:10px;">';
    dates.forEach(function(d) {
      var dayTasks = records[d] || {};
      var dayNames = tasks.filter(function(t){ return dayTasks[t.id]; }).map(function(t){ return t.name; });
      html += '<div style="padding:6px 0;border-bottom:1px solid var(--card-border);font-size:13px;"><span style="color:var(--text-muted);">'+d+'</span> <span style="color:var(--accent);">'+dayNames.length+'个</span> '+(dayNames.length>0?dayNames.join('、'):'')+'</div>';
    });
    html += '</div></details>';
  }

  html += '</div>';
  panel.innerHTML = html;
}

function getCheckinStreak(taskId, records) {
  var streak = 0;
  var d = new Date();
  while (true) {
    var dateStr = d.toISOString().split('T')[0];
    if (records[dateStr] && records[dateStr][taskId]) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function toggleCheckin(taskId) {
  var today = getToday();
  var records = getCheckinRecords();
  if (!records[today]) records[today] = {};
  if (records[today][taskId]) {
    delete records[today][taskId];
  } else {
    records[today][taskId] = new Date().toISOString();
  }
  saveCheckinRecords(records);
  renderCheckinPanel();
}

function addCheckinTask() {
  var nameEl = document.getElementById('checkinName');
  var urlEl = document.getElementById('checkinUrl');
  if (!nameEl || !nameEl.value.trim()) return;
  var tasks = getCheckinTasks();
  tasks.push({ id: 't' + Date.now(), name: nameEl.value.trim(), url: urlEl.value.trim() });
  saveCheckinTasks(tasks);
  nameEl.value = '';
  urlEl.value = '';
  renderCheckinPanel();
}

function deleteCheckinTask(taskId) {
  if (!confirm('确定删除这个打卡任务？历史记录会保留。')) return;
  var tasks = getCheckinTasks();
  tasks = tasks.filter(function(t){ return t.id !== taskId; });
  saveCheckinTasks(tasks);
  renderCheckinPanel();
}

// ===== 股票分析 =====
function getStockList() { return JSON.parse(localStorage.getItem('cjs_stocks') || '["sh000001","sz399001","sz399006","sh600519","sz000858","sh601318"]'); }
function saveStockList(d) { localStorage.setItem('cjs_stocks', JSON.stringify(d)); }
var stockRefreshTimer = null;

  html += '<span style="font-size:14px;color:var(--text-muted);" id="stockUpdateTime">加载中...</span>';
  html += '<div style="display:flex;gap:8px;">';
  html += '<button onclick="fetchStockData()" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:6px 14px;font-size:13px;cursor:pointer;">🔄 刷新</button>';

  html += '</div>';

  // 股票列表容器

  // 添加股票
  html += '<div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:16px;margin-bottom:16px;">';
  html += '<div style="font-weight:600;margin-bottom:12px;font-size:14px;">➕ 添加自选股</div>';
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;">';
  html += '<input type="text" id="stockInput" placeholder="股票代码（如 sh600519 或 sz000001）" style="flex:1;min-width:200px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;" onkeydown="if(event.key===\'Enter\')addStock()">';
  html += '<button onclick="addStock()" class="note-save-btn">添加</button>';
  html += '</div>';

  var commonStocks = [

    {code:'sz000001', name:'平安银行'}, {code:'sh601398', name:'工商银行'},
    {code:'sh601012', name:'隆基绿能'}, {code:'sz300750', name:'宁德时代'},
    {code:'sh600276', name:'恒瑞医药'}, {code:'sz000333', name:'美的集团'},
    {code:'sh601899', name:'紫金矿业'}, {code:'sz002594', name:'比亚迪'},

function fetchStockData() {
  var stocks = getStockList();
  if (stocks.length === 0) {
    document.getElementById('stockList').innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:14px;">还没有自选股，在下方添加吧 📈</div>';
    return;
  }
  var codes = stocks.join(',');
  var listEl = document.getElementById('stockList');
  if (listEl) listEl.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:14px;">正在获取行情...</div>';

  fetch('https://qt.gtimg.cn/q=' + codes)
    .then(function(response) { return response.arrayBuffer(); })
    .then(function(buffer) {
      // 用 GBK 解码
      var text = new TextDecoder('GBK').decode(buffer);
      var html = '';
      var updateTime = '';
      stocks.forEach(function(code) {
        var match = text.match(new RegExp('v_' + code + '="([^"]*)"'));
        if (!match) return;
        var fields = match[1].split('~');
        if (fields.length < 35) return;
        var name = fields[1] || code;
        var lastPrice = parseFloat(fields[3]) || 0;
        var change = parseFloat(fields[31]) || 0;
        var changePct = parseFloat(fields[32]) || 0;
        var high = parseFloat(fields[33]) || 0;
        var low = parseFloat(fields[34]) || 0;
        var volume = parseFloat(fields[36]) || 0;
        updateTime = fields[30] || '';

        var isUp = change >= 0;
        var color = isUp ? '#dc2626' : '#16a34a';
        var arrow = isUp ? '▲' : '▼';
        var volumeStr = volume > 100000000 ? (volume/100000000).toFixed(2)+'亿' : volume > 10000 ? (volume/10000).toFixed(2)+'万' : volume;
        var xqCode = code.replace('sh','SH').replace('sz','SZ');
        var thsCode = code.replace('sh','').replace('sz','');

        html += '<div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:12px 16px;">';
        html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;">';
        html += '<div><div style="font-size:15px;font-weight:700;color:var(--text-dark);">'+name+'</div><div style="font-size:11px;color:var(--text-muted);">'+code+'</div></div>';
        html += '<div style="text-align:right;"><div style="font-size:20px;font-weight:700;color:'+color+';">'+lastPrice.toFixed(2)+'</div><div style="font-size:12px;color:'+color+';">'+arrow+' '+Math.abs(change).toFixed(2)+' ('+changePct.toFixed(2)+'%)</div></div>';
        html += '</div>';
        html += '<div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--text-muted);"><span>高 '+high.toFixed(2)+'</span><span>低 '+low.toFixed(2)+'</span><span>量 '+volumeStr+'</span></div>';
        html += '<div style="display:flex;gap:8px;margin-top:8px;">';
        html += '<a href="https://xueqiu.com/S/'+xqCode+'" target="_blank" style="font-size:11px;color:var(--accent);text-decoration:none;">雪球详情</a>';
        html += '<span style="color:#ddd;">|</span>';
        html += '<a href="https://stockpage.10jqka.com.cn/'+thsCode+'/" target="_blank" style="font-size:11px;color:var(--accent);text-decoration:none;">同花顺</a>';
        html += '<span style="color:#ddd;">|</span>';
        html += '<button onclick="removeStock(\''+code+'\')" style="font-size:11px;color:#999;background:none;border:none;cursor:pointer;text-decoration:underline;">删除</button>';
        html += '</div></div>';
      });
      if (listEl) listEl.innerHTML = html || '<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:14px;">获取行情失败，请刷新重试</div>';
      if (updateTime) {
        var t = updateTime.length >= 14 ? updateTime.slice(0,4)+'-'+updateTime.slice(4,6)+'-'+updateTime.slice(6,8)+' '+updateTime.slice(8,10)+':'+updateTime.slice(10,12)+':'+updateTime.slice(12,14) : updateTime;
        var ut = document.getElementById('stockUpdateTime');
        if (ut) ut.textContent = '更新于 ' + t;
      }
    })
    .catch(function(err) {
      if (listEl) listEl.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:14px;">网络异常，请稍后重试<br><span style="font-size:11px;">'+err.message+'</span></div>';
    });
}

function addStock() {
  var input = document.getElementById('stockInput');
  if (!input || !input.value.trim()) return;
  var code = input.value.trim().toLowerCase();
  if (!code.match(/^(sh|sz)\d{6}$/)) {
    alert('请输入正确格式：sh + 6位数字（上证）或 sz + 6位数字（深证）');
    return;
  }
  var stocks = getStockList();
  if (stocks.indexOf(code) !== -1) { alert('已存在'); return; }
  stocks.push(code);
  saveStockList(stocks);
  input.value = '';
  renderStockPanel();
}

function quickAddStock(code) {
  var stocks = getStockList();
  if (stocks.indexOf(code) !== -1) { alert('已存在'); return; }
  stocks.push(code);
  saveStockList(stocks);
  renderStockPanel();
}

function removeStock(code) {
  var stocks = getStockList();
  stocks = stocks.filter(function(s){ return s !== code; });
  saveStockList(stocks);
  renderStockPanel();
}
